<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>Pulse Console · 设备集群控制台</title>
<link rel="stylesheet" href="/console-v2.css">
</head>
<body>
<main class="wrap">
  <header class="top">
    <div class="brand"><h1>Pulse Console</h1><p>设备集群控制台 · 简洁兼容版</p><div id="connection" class="status"><i class="dot"></i>正在连接</div></div>
    <div class="actions">
      <button id="refresh">刷新设备</button>
      <button id="discover" class="primary">发现设备</button>
      <button id="connectBtn">手动连接</button>
      <button id="versions">扫描版本</button>
      <button id="heartbeats">心跳扫描</button>
      <button id="logout">退出登录</button>
    </div>
  </header>
  <div id="notice" class="notice" hidden></div>
  <section class="cards">
    <div class="card"><span>设备总数</span><strong id="countAll">—</strong></div>
    <div class="card"><span>在线设备</span><strong id="countOnline">—</strong></div>
    <div class="card"><span>离线 / 未授权</span><strong id="countOffline">—</strong></div>
    <div class="card"><span>正在重启</span><strong id="countReboot">—</strong></div>
  </section>
  <div class="toolbar">
    <input id="search" class="field" type="search" placeholder="搜索设备名称、序列号、IP、版本或地址">
    <label class="status"><input id="selectAll" type="checkbox"> 全选当前结果</label>
    <span id="selectedCount" class="status">0 台已选择</span>
    <button id="rebootSelected" class="danger">分批重启所选设备</button>
  </div>
  <section class="panel">
    <div class="table-wrap">
      <table id="table">
        <thead><tr><th></th><th>设备</th><th>状态</th><th>连接地址</th><th>版本</th><th>Acurast 地址</th><th>操作</th></tr></thead>
        <tbody id="deviceRows"></tbody>
      </table>
      <div id="empty" class="empty" hidden>暂无匹配设备。可以尝试“发现设备”或“手动连接”。</div>
    </div>
  </section>
  <footer class="footer">自动刷新间隔：6 秒。此兼容版使用原有后端 API；高级功能可继续逐项迁移。重启操作会影响设备在线状态，请确认选择后再执行。</footer>
</main>
<div id="connectModal" class="modal" hidden>
  <form id="connectForm" class="modal-card">
    <h2>手动连接设备</h2>
    <p class="sub">输入 Android 无线调试地址，例如 192.168.1.20:5555。</p>
    <input id="host" class="field" style="width:100%" placeholder="IP:端口" required>
    <div class="modal-actions"><button type="button" id="cancelConnect">取消</button><button class="primary" type="submit">连接</button></div>
  </form>
</div>
<script src="/console-v2.js" defer></script>
</body>
</html>
