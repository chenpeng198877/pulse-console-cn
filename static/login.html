<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="dark"><title>登录 · Pulse Console</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px;background:#0b1220;color:#edf4ff;font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.card{width:min(390px,100%);padding:28px;border:1px solid #293950;border-radius:16px;background:#121d2e}h1{margin:0 0 8px}p{color:#9aabc1}label{display:block;margin:18px 0 7px}input{width:100%;padding:12px;border:1px solid #394b62;border-radius:9px;background:#0b1422;color:#fff;font:inherit}button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:9px;background:#c8f135;color:#17210a;font:700 15px system-ui;cursor:pointer}button:disabled{opacity:.6}#err{min-height:22px;color:#ff9c9c;font-size:13px}</style></head><body><main class="card"><h1>Pulse Console</h1><p>请输入控制台密码以继续。</p><form id="login"><label for="password">访问密码</label><input id="password" type="password" autocomplete="current-password" required autofocus><button id="submit" type="submit">登录</button><div id="err" role="alert"></div></form><p style="font-size:12px">首次使用默认密码为 123456。请在可信网络内使用，并及时修改密码。</p></main><script>const f=document.querySelector('#login'),p=document.querySelector('#password'),b=document.querySelector('#submit'),e=document.querySelector('#err');f.addEventListener('submit',async ev=>{ev.preventDefault();b.disabled=true;b.textContent='正在验证…';e.textContent='';try{const r=await fetch('/api/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:p.value})});const d=await r.json();if(!r.ok||!d.ok)throw new Error(r.status===401?'密码错误，请重试。':(d.message||'登录失败，HTTP '+r.status));const s=await fetch('/api/session',{cache:'no-store',credentials:'same-origin'});if(!s.ok)throw new Error('登录响应成功，但浏览器未保存会话 Cookie。请检查浏览器 Cookie 设置。');location.replace('/')}catch(x){e.textContent=x.message||'连接失败';p.select()}finally{b.disabled=false;b.textContent='登录'}});</script></body></html>
