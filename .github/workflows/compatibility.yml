name: Compatibility checks
on:
  pull_request:
  push:
    branches:
      - main
      - rewrite/compatible-console-v2
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Compile Python
        run: python -m py_compile fleet.py heartbeat_scan.py
      - name: Check JavaScript syntax
        run: node --check static/console-v2.js
      - name: Build Docker image
        run: docker build -t pulse-console-cn:ci .
